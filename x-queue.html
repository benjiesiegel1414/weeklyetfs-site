<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>X Post Queue | WeeklyETFs.com</title>
<link rel="icon" href="/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --navy:#001f3d; --navy-2:#0b3157; --red:#e74c3c; --bg:#f4f5f7; --surface:#fff; --ink:#0f1b2a; --ink-2:#4a5868; --ink-3:#8793a1; --line:#dfe3e8; --okbg:#e6f4ec; --ok:#1d7a4a; --warnbg:#fff4db; --warn:#8a5a00; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Lato, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
header.top { background: var(--navy); color: #fff; }
header.top .in { max-width: 1180px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 900; font-size: 20px; letter-spacing: -.01em; }
.brand b { color: var(--red); }
.status { color: #aab8c7; font-size: 13px; }
.spacer { flex: 1; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.btn:hover { border-color: #c5ccd4; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: #cf3f30; }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: #b42318; }
.btn:disabled { opacity: .5; cursor: default; }
header.top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.toolbar input, .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.notice { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; background: #e8eef5; color: var(--navy); }
.post { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.post img { width: 100%; display: block; border-radius: 10px; aspect-ratio: 16 / 9; background: var(--navy); }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.meta select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); }
.tag { padding: 2px 8px; border-radius: 6px; background: #e8eef5; color: var(--navy); font-weight: 700; font-size: 12px; }
.tag.sent { background: var(--okbg); color: var(--ok); }
textarea { width: 100%; min-height: 190px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chars { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.chars.over { color: #b42318; font-weight: 700; }
.err-text { color: #b42318; font-size: 13px; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, 94vw); box-shadow: 0 20px 60px rgba(0,31,61,.3); }
dialog::backdrop { background: rgba(0,31,61,.5); }
dialog form { padding: 22px; display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 18px; }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
dialog label.check { display: flex; align-items: center; gap: 8px; }
dialog input[type=text], dialog input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.hint { font-size: 12px; color: var(--ink-3); }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 92vw; }
@media (max-width: 820px) { .post { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div>
    <div class="brand">Weekly<b>ETFs</b>.com X posts</div>
    <div class="status" id="dataStatus">Loading today's yields…</div>
  </div>
  <span class="spacer"></span>
  <button class="btn" id="settingsBtn">Settings</button>
</div></header>

<div class="wrap">
  <div class="notice">Open this page in the browser where you're logged into the <b>WeeklyETFs</b> X account. <b>Post it myself</b> opens X as whoever is logged in there.</div>
  <div class="toolbar">
    <label>Posts <input id="howMany" type="number" min="1" max="20" value="5" style="width:64px"></label>
    <button class="btn navy" id="genBtn" disabled>Generate posts</button>
    <span class="spacer"></span>
    <span class="status" id="countNote" style="color:var(--ink-3)"></span>
  </div>
  <div id="drafts"></div>
</div>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <span class="hint">Saved only in this browser.</span>
    <label>Favorite tickers (show up more often)<input type="text" id="s_fav" placeholder="CHPY, BLOX, GOOW"></label>
    <label>Never use these tickers<input type="text" id="s_excl" placeholder="XYZ"></label>
    <label>Highest yield to include (%)<input type="number" id="s_max" min="5" max="500"><span class="hint">Skips funds above this, in case a yield in the sheet looks off.</span></label>
    <label class="check"><input type="checkbox" id="s_nodecay"> Only use funds with no price decay</label>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form>
</dialog>

<script>
/* ================= CONFIG ================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1P00pQ6hNvYolxzrKYIuxC-AH1xFBpMtsn-NwC17W4vQazk3ql69ZmSmW8J-jp7OaUmKLV5v2KPI3/pub?gid=0&single=true&output=csv";
const CFG_KEY = 'wx.cfg.v1', HIST_KEY = 'wx.history.v1';
const safeJSON = s => { try { return JSON.parse(s); } catch (e) { return null; } };
let cfg = { fav: '', excl: '', max: 150, nodecay: false, ...(safeJSON(localStorage.getItem(CFG_KEY)) || {}) };
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };
const $ = id => document.getElementById(id);
const state = { funds: [], drafts: [], history: new Set(safeJSON(localStorage.getItem(HIST_KEY)) || []) };

/* ================= DATA (WeeklyETFs sheet: Symbol, ETF Name, Dividend Yield, Price Decay, Total Return) ================= */
function parseCSV(text) {
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell.trim()); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell.trim()); out.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell.trim()); out.push(row); }
  return out;
}
const num = s => { const v = parseFloat(String(s ?? '').replace(/[$,%\s]/g, '')); return isNaN(v) ? null : v; };
const buildFund = c => ({ sym: (c[0] || '').toUpperCase().replace(/[^A-Z.]/g, ''), name: c[1] || '', yield: num(c[2]), decay: String(c[3] || '').trim().toUpperCase(), tr: num(c[4]) });

/* ================= HELPERS ================= */
const usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = v => (Math.abs(v) < 100 ? usd2 : usd0).format(v || 0);
const pct = v => (+v).toFixed(2).replace(/\.?0+$/, '') + '%';
const short = v => v >= 1e6 ? '$' + (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e4 ? '$' + Math.round(v / 1e3) + 'K' : v >= 1e3 ? '$' + (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : '$' + Math.round(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tickers = s => String(s || '').toUpperCase().split(/[\s,]+/).filter(Boolean);
const weekly = (amt, f) => amt * f.yield / 100 / 52;
const roundTo = (v, s) => Math.round(v / s) * s;

/* ================= POST TYPES ================= */
const signed = v => (v > 0 ? '+' : '') + pct(v);
const LISTS = {
  topyield: { label: 'List: highest yield', sizes: [10, 8, 7, 5], filter: f => true, sort: (a, b) => b.yield - a.yield,
    val: f => pct(f.yield), sub: f => f.tr != null ? `${signed(f.tr)} total return` : '', caveat: true,
    title: n => `${n} highest yielding weekly ETFs right now`,
    heads: n => [`🔥 The ${n} highest yielding weekly ETFs right now 👇`, `${n} weekly ETFs with the biggest yields today 👇`, `Top ${n} weekly payers by yield 👇`] },
  toptr: { label: 'List: top total return', sizes: [10, 8, 7, 5], filter: f => f.tr != null, sort: (a, b) => b.tr - a.tr,
    val: f => signed(f.tr), sub: f => `${pct(f.yield)} yield`, caveat: false,
    title: n => `${n} top total return weekly ETFs`,
    heads: n => [`📈 ${n} top total return weekly ETFs right now 👇`, `The ${n} best performing weekly ETFs by total return 👇`, `${n} weekly payers crushing it on total return 👇`] },
  nodecay: { label: 'List: no price decay', sizes: [10, 8, 7, 5], filter: f => f.decay === 'NO', sort: (a, b) => b.yield - a.yield,
    val: f => pct(f.yield), sub: f => f.tr != null ? `${signed(f.tr)} total return` : 'No price decay', caveat: true,
    title: n => `${n} weekly ETFs with NO price decay`,
    heads: n => [`✅ ${n} high yield weekly ETFs with NO price decay 👇`, `${n} weekly payers with zero price decay, ranked by yield 👇`, `Big weekly income, no price decay 👇\n\nTop ${n} right now`] },
  yieldtr: { label: 'List: 20%+ yield and positive return', sizes: [8, 7, 5], filter: f => f.yield >= 20 && f.tr > 0, sort: (a, b) => b.tr - a.tr,
    val: f => signed(f.tr), sub: f => `${pct(f.yield)} yield`, caveat: true,
    title: n => `${n} weekly ETFs: 20%+ yield AND positive returns`,
    heads: n => [`💰 ${n} weekly ETFs yielding 20%+ that are still UP on total return 👇`, `20%+ yields and positive total returns 👇\n\n${n} weekly ETFs doing both`] },
  over30: { label: 'List: 30%+ yield club', sizes: [10, 8, 7, 5], filter: f => f.yield >= 30, sort: (a, b) => b.yield - a.yield,
    val: f => pct(f.yield), sub: f => f.tr != null ? `${signed(f.tr)} total return` : '', caveat: true,
    title: n => `The 30%+ yield club: ${n} weekly ETFs`,
    heads: n => [`🚀 The 30%+ yield club 👇\n\n${n} weekly ETFs yielding over 30%`, `${n} weekly ETFs paying 30%+ right now 👇`] },
};
const isList = k => k in LISTS;
const KIND_LABEL = { lineup: 'Weekly paycheck lineup', h2h: 'Head to head', basket: 'Weekly basket', goal: 'Weekly goal', ...Object.fromEntries(Object.entries(LISTS).map(([k, v]) => [k, v.label])) };
const FUNDS_PER = { lineup: 5, h2h: 2, basket: 3, goal: 4 };
const AMOUNTS = { lineup: [10000, 25000, 50000, 100000], h2h: [10000, 25000, 50000, 100000, 250000], basket: [30000, 60000, 90000, 150000, 300000], goal: [100, 250, 500, 1000] };
const ASKS = ['Which one are you holding? 👇', 'Which would you pick? 👇', 'Drop your favorite weekly payer 👇', ''];
const CAVEAT = 'Based on today\'s yields, which can change and aren\'t guaranteed';

function pool() {
  const excl = new Set(tickers(cfg.excl));
  return state.funds.filter(f => f.yield > 0.5 && f.yield <= (+cfg.max || 150) && !excl.has(f.sym) && (!cfg.nodecay || f.decay === 'NO'));
}
function chooseFunds(n, avoid = new Set()) {
  const fav = tickers(cfg.fav), all = pool().filter(f => !avoid.has(f.sym));
  const favs = shuffle(all.filter(f => fav.includes(f.sym)));
  const picked = [];
  if (favs.length && Math.random() < .5) picked.push(favs[0]);
  for (const f of shuffle(all)) { if (picked.length >= n) break; if (!picked.includes(f)) picked.push(f); }
  return picked.length === n ? picked : null;
}
const histKey = p => isList(p.kind) ? `${p.kind}_${p.funds.map(f => f.sym).join('+')}` : `${p.kind}_${p.funds.map(f => f.sym).sort().join('+')}_${p.amt}`;
const today = () => new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

function listText(p) {
  const L = LISTS[p.kind], n = p.funds.length;
  const rows = p.funds.map((f, i) => `${i + 1}. $${f.sym} ${L.val(f)}`).join('\n');
  const foot = pick(['Full list at WeeklyETFs.com', 'Track them all at WeeklyETFs.com', 'Every weekly ETF ranked at WeeklyETFs.com']);
  const opts = [
    `${pick(L.heads(n))}\n\n${rows}\n\n${foot}` + (L.caveat ? '\n\nYields change and aren\'t guaranteed' : ''),
    `${pick(L.heads(n))}\n\n${rows}\n\n${foot}`,
    `${pick(L.heads(n))}\n\n${rows}`,
  ];
  return opts.find(t => [...t].length <= 280) || opts[opts.length - 1];
}
function writeText(p) {
  if (isList(p.kind)) return listText(p);
  const F = p.funds, amt = usd0.format(p.amt), ask = pick(ASKS), end = '\n\n' + CAVEAT + (ask ? '\n\n' + ask : '');
  if (p.kind === 'lineup') {
    const rows = [...F].sort((a, b) => weekly(p.amt, b) - weekly(p.amt, a)).map(f => `$${f.sym}: ${money(weekly(p.amt, f))}/week`).join('\n');
    return pick([
      `What ${amt} pays you every week 👇\n\n${rows}`,
      `${amt} in each of these weekly payers\n\nHere's your weekly paycheck 👇\n\n${rows}`,
      `5 weekly paychecks from ${amt} each\n\n${rows}`,
    ]) + end;
  }
  if (p.kind === 'h2h') {
    const [a, b] = F, wa = weekly(p.amt, a), wb = weekly(p.amt, b);
    return pick([
      `${amt} in $${a.sym} vs $${b.sym} 👇\n\n$${a.sym} pays about ${money(wa)} every week\n$${b.sym} pays about ${money(wb)} every week`,
      `Same ${amt}, two weekly payers\n\n$${a.sym} at ${pct(a.yield)}: ${money(wa)}/week\n$${b.sym} at ${pct(b.yield)}: ${money(wb)}/week`,
      `$${a.sym} or $${b.sym}?\n\n${amt} in $${a.sym}: ${money(wa)} a week\n${amt} in $${b.sym}: ${money(wb)} a week`,
    ]) + end;
  }
  if (p.kind === 'basket') {
    const each = p.amt / F.length, per = F.map(f => weekly(each, f)), total = per.reduce((x, y) => x + y, 0);
    const list = F.map((f, i) => `$${f.sym}: ${money(per[i])}/week`).join('\n');
    const names = F.map(f => '$' + f.sym);
    return pick([
      `${amt} split across ${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}\n\n${list}\n\nTotal: about ${money(total)} every week\nThat's ${money(total * 52 / 12)} a month`,
      `A simple weekly income basket 👇\n\n${usd0.format(each)} each in ${names.join(', ')}\n\nPays about ${money(total)} every week\n${money(total * 52)} a year`,
    ]) + end;
  }
  // goal
  const g = usd0.format(p.amt);
  const rows = [...F].map(f => [f, roundTo(p.amt * 52 / (f.yield / 100), 100)]).sort((a, b) => a[1] - b[1]).map(([f, need]) => `$${f.sym}: ${usd0.format(need)}`).join('\n');
  return pick([
    `How much you need to make ${g} every week 👇\n\n${rows}`,
    `Want a ${g} weekly paycheck?\n\nHere's what it takes in each 👇\n\n${rows}`,
  ]) + end;
}

/* ================= IMAGE (1200x675, WeeklyETFs brand) ================= */
function roundRect(ctx, x, y, w, h, r) { r = Math.min(r, h / 2, w / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawImage(p) {
  const W = 1200, H = 675, S = 2, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  const F = (w, s) => `${w} ${s}px Lato, Arial, sans-serif`;
  ctx.fillStyle = '#001f3d'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W, 0, 0, W, 0, 900); g.addColorStop(0, 'rgba(231,76,60,.22)'); g.addColorStop(1, 'rgba(231,76,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, 0, W, 8);
  ctx.textAlign = 'left'; ctx.font = F(900, 26); ctx.fillStyle = '#fff'; ctx.fillText('Weekly', 64, 70);
  const ww = ctx.measureText('Weekly').width; ctx.fillStyle = '#e74c3c'; ctx.fillText('ETFs', 64 + ww, 70);
  const we = ctx.measureText('ETFs').width; ctx.fillStyle = '#fff'; ctx.fillText('.com', 64 + ww + we, 70);
  const F2 = p.funds;
  let title, sub, rows, total = null;
  if (p.kind === 'lineup') {
    title = `What ${usd0.format(p.amt)} pays every week`; sub = 'In each fund, at today\'s yield';
    rows = [...F2].map(f => ({ sym: f.sym, y: f.yield, v: weekly(p.amt, f), label: money(weekly(p.amt, f)) + '/wk' })).sort((a, b) => b.v - a.v);
  } else if (p.kind === 'h2h') {
    title = `${usd0.format(p.amt)} in ${F2[0].sym} vs ${F2[1].sym}`; sub = 'Weekly income at today\'s yield';
    rows = F2.map(f => ({ sym: f.sym, y: f.yield, v: weekly(p.amt, f), label: money(weekly(p.amt, f)) + '/wk' }));
  } else if (p.kind === 'basket') {
    const each = p.amt / F2.length;
    title = `${usd0.format(p.amt)} split ${F2.length} ways`; sub = `${usd0.format(each)} in each fund`;
    rows = F2.map(f => ({ sym: f.sym, y: f.yield, v: weekly(each, f), label: money(weekly(each, f)) + '/wk' }));
    total = rows.reduce((x, r) => x + r.v, 0);
  } else {
    title = `To earn ${usd0.format(p.amt)} every week`; sub = 'You\'d need to invest';
    rows = F2.map(f => { const need = roundTo(p.amt * 52 / (f.yield / 100), 100); return { sym: f.sym, y: f.yield, v: need, label: short(need) }; }).sort((a, b) => a.v - b.v);
  }
  ctx.fillStyle = '#fff'; let ts = 52; ctx.font = F(900, ts);
  while (ctx.measureText(title).width > (total !== null ? 640 : 1070) && ts > 30) { ts -= 2; ctx.font = F(900, ts); }
  ctx.fillText(title, 64, 150);
  ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, 24); ctx.fillText(sub, 64, 190);
  if (total !== null) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, 22); ctx.fillText('Total every week', W - 64, 120);
    ctx.fillStyle = '#fff'; ctx.font = F(900, 64); ctx.fillText(money(total), W - 64, 186);
    ctx.textAlign = 'left';
  }
  // horizontal bars
  const top = 236, bottom = H - 48, n = rows.length, gap = 14, rh = Math.min(118, (bottom - top - gap * (n - 1)) / n);
  const labelW = 200, barX = 64 + labelW, max = Math.max(...rows.map(r => r.v), 1);
  ctx.font = F(900, Math.min(44, rh * .44));
  const labelMax = Math.max(...rows.map(r => ctx.measureText(r.label).width));
  const barMax = (W - 88) - labelMax - 36 - barX;
  rows.forEach((r, i) => {
    const y = top + i * (rh + gap);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; roundRect(ctx, 64, y, W - 128, rh, 12); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = F(900, Math.min(44, rh * .42)); ctx.fillText(r.sym, 88, y + rh * .52);
    ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, Math.min(22, rh * .25)); ctx.fillText(pct(r.y) + ' yield', 88, y + rh * .8);
    const bw = Math.max(8, r.v / max * barMax), bh = Math.min(30, rh * .36), by = y + (rh - bh) / 2;
    const gg = ctx.createLinearGradient(barX, 0, barX + bw, 0); gg.addColorStop(0, '#c0392b'); gg.addColorStop(1, '#ff6b5a');
    ctx.fillStyle = gg; roundRect(ctx, barX, by, bw, bh, bh / 2); ctx.fill();
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = F(900, Math.min(44, rh * .44)); ctx.fillText(r.label, W - 88, y + rh / 2 + rh * .15);
  });
  return cv.toDataURL('image/png');
}

function drawList(p) {
  const W = 1200, H = 675, S = 2, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  const F = (w, s) => `${w} ${s}px Lato, Arial, sans-serif`, L = LISTS[p.kind], items = p.funds;
  ctx.fillStyle = '#001f3d'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W, 0, 0, W, 0, 900); g.addColorStop(0, 'rgba(231,76,60,.22)'); g.addColorStop(1, 'rgba(231,76,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, 0, W, 8);
  ctx.textAlign = 'left'; ctx.font = F(900, 24); ctx.fillStyle = '#fff'; ctx.fillText('Weekly', 56, 58);
  const ww = ctx.measureText('Weekly').width; ctx.fillStyle = '#e74c3c'; ctx.fillText('ETFs', 56 + ww, 58);
  const we = ctx.measureText('ETFs').width; ctx.fillStyle = '#fff'; ctx.fillText('.com', 56 + ww + we, 58);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, 18); ctx.fillText(`Data as of ${today()}`, W - 56, 58);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; let ts = 44; ctx.font = F(900, ts);
  const title = L.title(items.length); while (ctx.measureText(title).width > W - 112 && ts > 28) { ts -= 2; ctx.font = F(900, ts); }
  ctx.fillText(title, 56, 122);
  const cols = items.length > 5 ? 2 : 1, perCol = Math.ceil(items.length / cols), top = 152, bottom = H - 36, gap = 10;
  const colW = (W - 112 - (cols - 1) * 20) / cols, rh = Math.min(92, (bottom - top - gap * (perCol - 1)) / perCol);
  items.forEach((f, i) => {
    const col = Math.floor(i / perCol), row = i % perCol, x = 56 + col * (colW + 20), y = top + row * (rh + gap);
    ctx.fillStyle = i === 0 ? 'rgba(231,76,60,.18)' : 'rgba(255,255,255,.06)'; roundRect(ctx, x, y, colW, rh, 12); ctx.fill();
    const cr = Math.min(20, rh * .32), cx = x + 18 + cr, cy = y + rh / 2;
    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fillStyle = '#e74c3c'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = F(900, cr * 1.05); ctx.fillText(String(i + 1), cx, cy + cr * .37);
    ctx.textAlign = 'left'; const tx = cx + cr + 16, sub = L.sub(f);
    ctx.fillStyle = '#fff'; ctx.font = F(900, Math.min(30, rh * .38)); ctx.fillText(f.sym, tx, sub ? y + rh * .5 : cy + rh * .13);
    if (sub) { ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, Math.min(17, rh * .22)); ctx.fillText(sub, tx, y + rh * .8); }
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = F(900, Math.min(34, rh * .42)); ctx.fillText(L.val(f), x + colW - 18, cy + rh * .14);
  });
  return cv.toDataURL('image/png');
}

/* ================= GENERATE ================= */
function makeList(kind, skipSize) {
  const L = LISTS[kind], ranked = pool().filter(L.filter).sort(L.sort);
  for (const size of shuffle(L.sizes.filter(n => n !== skipSize))) {
    if (ranked.length < size) continue;
    const p = { id: Math.random().toString(36).slice(2, 10), kind, funds: ranked.slice(0, size), amt: size };
    if (state.history.has(histKey(p)) || state.drafts.some(d => d.id !== p.id && histKey(d) === histKey(p))) continue;
    p.text = writeText(p); p.img = drawList(p); return p;
  }
  return null;
}
function makePost(kind, avoid) {
  if (isList(kind)) return makeList(kind);
  for (let i = 0; i < 30; i++) {
    const funds = chooseFunds(FUNDS_PER[kind], avoid); if (!funds) return null;
    const p = { id: Math.random().toString(36).slice(2, 10), kind, funds, amt: pick(AMOUNTS[kind]) };
    if (kind === 'h2h' || kind === 'goal' || kind === 'lineup') { /* order handled in text */ }
    if (!state.history.has(histKey(p)) && !state.drafts.some(d => d !== p && histKey(d) === histKey(p))) { p.text = writeText(p); p.img = drawImage(p); return p; }
  }
  return null;
}
async function generate() {
  const n = Math.max(1, Math.min(20, parseInt($('howMany').value, 10) || 5));
  try { await document.fonts.load('900 40px Lato'); await document.fonts.load('700 24px Lato'); } catch (e) {}
  // About half lists, half the other formats, never the same list type twice in a batch
  const lists = shuffle(Object.keys(LISTS)), others = shuffle(['lineup', 'h2h', 'basket', 'goal']), out = [];
  state.drafts = []; let li = 0, oi = 0;
  for (let i = 0; i < n; i++) {
    let p = null;
    if (i % 2 === 0) while (!p && li < lists.length) p = makePost(lists[li++]);
    if (!p) p = makePost(others[oi++ % others.length], new Set());
    if (p) { out.push(p); state.drafts = out; }
  }
  render();
}

/* ================= UI ================= */
function lint(t) {
  const issues = [];
  if (/[—–]/.test(t)) issues.push('has a dash (em or en)');
  if (t.split('\n').some(l => /\.\s*$/.test(l.trim()) && l.trim().length)) issues.push('a line ends with a period');
  if ([...t].length > 280) issues.push('over 280 characters');
  return issues.length ? `<div class="err-text">Check: ${issues.join(', ')}</div>` : '';
}
function render() {
  const box = $('drafts');
  $('countNote').textContent = state.drafts.length ? `${state.drafts.filter(d => d.sent).length} of ${state.drafts.length} sent` : '';
  if (!state.drafts.length) { box.innerHTML = `<div class="empty">Click <b>Generate posts</b> to build posts from today's WeeklyETFs yields.</div>`; return; }
  box.innerHTML = state.drafts.map(p => {
    const len = [...p.text].length;
    return `<article class="post" data-id="${p.id}">
      <img src="${p.img}" alt="Image for ${esc(p.funds.map(f => f.sym).join(', '))} post">
      <div class="side">
        <div class="meta">
          <select data-act="kind" aria-label="Post type">${Object.entries(KIND_LABEL).map(([k, v]) => `<option value="${k}"${k === p.kind ? ' selected' : ''}>${v}</option>`).join('')}</select>
          ${isList(p.kind) ? `<span class="tag">${p.funds.length} funds</span>` : p.funds.map(f => `<span class="tag">$${esc(f.sym)} ${pct(f.yield)}</span>`).join('')}
          ${p.sent ? '<span class="tag sent">Sent to X</span>' : ''}
        </div>
        <textarea data-act="text" aria-label="Post text">${esc(p.text)}</textarea>
        <div class="row">
          <button class="btn small primary" data-act="manual">${p.sent ? 'Post it again' : 'Post it myself'}</button>
          ${p.needsLink ? `<a class="btn small navy" href="${esc(xUrl(p))}" target="_blank" rel="noopener" style="text-decoration:none">Open X ↗</a>` : ''}
          <button class="btn small" data-act="saveimg">Save image</button>
          <button class="btn small" data-act="copytext">Copy text</button>
          <button class="btn small" data-act="swap">${isList(p.kind) ? 'Change list size' : 'New funds'}</button>
          ${isList(p.kind) ? '' : '<button class="btn small" data-act="amount">New amount</button>'}
          <button class="btn small" data-act="rewrite">Rewrite text</button>
          <button class="btn small danger" data-act="remove">Remove</button>
          <span class="chars${len > 280 ? ' over' : ''}">${len}/280</span>
        </div>
        ${lint(p.text)}
      </div></article>`;
  }).join('');
}
function redraw(p) { p.text = writeText(p); p.img = isList(p.kind) ? drawList(p) : drawImage(p); }
$('drafts').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const p = state.drafts.find(d => d.id === btn.closest('.post').dataset.id); if (!p) return;
  const act = btn.dataset.act;
  if (act === 'remove') { state.drafts = state.drafts.filter(d => d !== p); return render(); }
  if (act === 'manual') return postManually(p);
  if (act === 'saveimg') return saveImage(p);
  if (act === 'copytext') return navigator.clipboard.writeText(p.text).then(() => toast('Text copied'), () => toast("Couldn't copy, select the text and copy it"));
  if ((act === 'swap' || act === 'amount') && isList(p.kind)) { const np = makeList(p.kind, p.funds.length); if (!np) return toast('No other size left for this list today'); Object.assign(p, np, { id: p.id, sent: false }); return render(); }
  if (act === 'swap') { const f = chooseFunds(FUNDS_PER[p.kind]); if (!f) return toast('Not enough funds in the pool'); p.funds = f; redraw(p); }
  if (act === 'amount') { const opts = AMOUNTS[p.kind].filter(a => a !== p.amt); p.amt = pick(opts.length ? opts : AMOUNTS[p.kind]); redraw(p); }
  if (act === 'rewrite') p.text = writeText(p);
  render();
});
$('drafts').addEventListener('change', e => {
  if (e.target.dataset.act !== 'kind') return;
  const p = state.drafts.find(d => d.id === e.target.closest('.post').dataset.id); if (!p) return;
  const np = makePost(e.target.value, new Set()); if (!np) return toast('Not enough funds for that type');
  Object.assign(p, np, { id: p.id, sent: false }); render();
});
$('drafts').addEventListener('input', e => {
  if (e.target.dataset.act !== 'text') return;
  const card = e.target.closest('.post'), p = state.drafts.find(d => d.id === card.dataset.id); if (!p) return;
  p.text = e.target.value;
  const link = card.querySelector('a.btn'); if (link) link.href = xUrl(p);
  const len = [...p.text].length, ch = card.querySelector('.chars'); ch.textContent = `${len}/280`; ch.classList.toggle('over', len > 280);
  card.querySelectorAll('.err-text').forEach(x => x.remove()); const l = lint(p.text); if (l) card.querySelector('.side').insertAdjacentHTML('beforeend', l);
});

/* ================= POST IT MYSELF ================= */
function dataURLtoBlob(url) { const [h, d] = url.split(','), b = atob(d), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return new Blob([a], { type: h.match(/:(.*?);/)[1] }); }
const xUrl = p => 'https://x.com/intent/post?text=' + encodeURIComponent(p.text);
function saveImage(p) { const a = document.createElement('a'); a.href = p.img; a.download = `weeklyetfs-${p.kind}.png`; document.body.appendChild(a); a.click(); a.remove(); }
const isTouch = matchMedia('(pointer: coarse)').matches;
function remember(p) { state.history.add(histKey(p)); try { localStorage.setItem(HIST_KEY, JSON.stringify([...state.history].slice(-3000))); } catch (e) {} }
function postManually(p) {
  const blob = dataURLtoBlob(p.img), file = new File([blob], `weeklyetfs-${p.kind}.png`, { type: 'image/png' });
  const done = () => { p.sent = true; remember(p); render(); };
  if (isTouch && navigator.canShare && navigator.canShare({ files: [file], text: p.text })) {
    navigator.share({ files: [file], text: p.text }).then(() => { done(); toast('Pick X in the share sheet. If the text is missing, tap Copy text and paste it', 8000); })
      .catch(e => { if (e.name !== 'AbortError') toast("Couldn't open the share sheet. Use Save image instead"); });
    return;
  }
  // Some browsers (Safari especially) block X from opening automatically. If so, show an Open X link on the post.
  const openX = () => { const w = window.open(xUrl(p), '_blank'); if (w) { try { w.opener = null; } catch (e) {} return true; } p.needsLink = true; return false; };
  let cp; try { cp = navigator.clipboard.write([new ClipboardItem({ 'image/png': Promise.resolve(blob) })]); } catch (e) { cp = Promise.reject(e); }
  cp.then(() => {
    const opened = openX(); done();
    toast(opened ? 'Image copied. Click in the X post box and press Cmd+V (Ctrl+V on Windows)' : 'Image copied. Now click Open X on this post, then paste the image with Cmd+V', 10000);
  }).catch(() => {
    saveImage(p); const opened = openX(); done();
    toast(opened ? 'Image saved to your Downloads. Drag it into the X post box' : 'Image saved to Downloads. Click Open X on this post, then drag the image in', 10000);
  });
}

/* ================= SETTINGS / BOOT ================= */
$('settingsBtn').addEventListener('click', () => { $('s_fav').value = cfg.fav; $('s_excl').value = cfg.excl; $('s_max').value = cfg.max; $('s_nodecay').checked = !!cfg.nodecay; $('settings').showModal(); });
$('settings').addEventListener('close', () => {
  if ($('settings').returnValue !== 'save') return;
  cfg = { fav: $('s_fav').value, excl: $('s_excl').value, max: parseFloat($('s_max').value) || 150, nodecay: $('s_nodecay').checked };
  saveCfg(); updateStatus(); toast('Settings saved');
});
let tt; function toast(m, ms = 4200) { document.querySelector('.toast')?.remove(); clearTimeout(tt); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); tt = setTimeout(() => t.remove(), ms); }
function updateStatus() { if (state.funds.length) $('dataStatus').textContent = `${state.funds.length} weekly ETFs loaded, ${pool().length} in the posting pool`; }
$('genBtn').addEventListener('click', generate);
render();
fetch(CSV_URL + '&t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(csv => {
    state.funds = parseCSV(csv.trim()).slice(1).filter(c => c[0]).map(buildFund).filter(f => f.sym && f.yield !== null);
    updateStatus(); $('genBtn').disabled = false;
  })
  .catch(() => { $('dataStatus').textContent = location.protocol === 'file:' ? "Couldn't load the sheet. Open this from weeklyetfs.com/x-queue instead" : "Couldn't load the sheet. Refresh to try again"; });
</script>
