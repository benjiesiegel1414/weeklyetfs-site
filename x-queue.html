<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>X Post Scheduler | WeeklyETFs.com</title>
<link rel="icon" href="/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --navy:#001f3d; --navy-2:#0b3157; --red:#e74c3c; --bg:#f4f5f7; --surface:#fff; --ink:#0f1b2a; --ink-2:#4a5868; --ink-3:#8793a1; --line:#dfe3e8; --okbg:#e6f4ec; --ok:#1d7a4a; --warnbg:#fff4db; --warn:#8a5a00; --errbg:#fdecea; --err:#b42318; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Lato, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
header.top { background: var(--navy); color: #fff; }
header.top .in { max-width: 1180px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 900; font-size: 20px; letter-spacing: -.01em; }
.brand b { color: var(--red); }
.status { color: #aab8c7; font-size: 13px; }
.spacer { flex: 1; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; text-decoration: none; display: inline-block; }
.btn:hover { border-color: #c5ccd4; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: #cf3f30; }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .5; cursor: default; }
header.top .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 700; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--red); }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--line); font-size: 12px; text-align: center; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.toolbar input, .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.cost { font-size: 13px; color: var(--ink-2); }
.notice { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; background: #e8eef5; color: var(--navy); }
.notice.warn { background: var(--warnbg); color: var(--warn); }
.notice.err { background: var(--errbg); color: var(--err); }
.post { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.post img { width: 100%; display: block; border-radius: 10px; aspect-ratio: 16 / 9; background: var(--navy); }
.post img.sq { aspect-ratio: 1 / 1; }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.meta select, .meta input[type=time] { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); }
.tag { padding: 2px 8px; border-radius: 6px; background: #e8eef5; color: var(--navy); font-weight: 700; font-size: 12px; }
.tag.sent { background: var(--okbg); color: var(--ok); }
.tag.pop { background: #fdeceb; color: #a8322a; }
textarea { width: 100%; min-height: 176px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chars { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.chars.over { color: var(--err); font-weight: 700; }
.linkopt { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.status-line { font-size: 13px; color: var(--ink-2); }
.status-line a { color: var(--red); }
.err-text { color: var(--err); font-size: 13px; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(580px, 94vw); box-shadow: 0 20px 60px rgba(0,31,61,.3); }
dialog::backdrop { background: rgba(0,31,61,.5); }
dialog form { padding: 22px; display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 18px; }
dialog h3 { margin: 6px 0 0; font-size: 14px; color: var(--navy); }
dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
dialog label.check { display: flex; align-items: center; gap: 8px; }
dialog input:not([type=checkbox]) { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
dialog .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 12px; color: var(--ink-3); }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 92vw; }
@media (max-width: 820px) { .post { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div>
    <div class="brand">Weekly<b>ETFs</b>.com X scheduler</div>
    <div class="status" id="dataStatus">Loading today's data…</div>
  </div>
  <span class="spacer"></span>
  <a class="btn" href="/x-lists">List posts</a>
  <button class="btn" id="settingsBtn">Settings</button>
</div></header>

<div class="wrap">
  <div id="setupNotice"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="drafts">Drafts<span class="count" id="nDrafts">0</span></button>
    <button role="tab" aria-selected="false" data-tab="scheduled">Scheduled<span class="count" id="nSched">·</span></button>
    <button role="tab" aria-selected="false" data-tab="posted">Posted</button>
    <button role="tab" aria-selected="false" data-tab="failed">Failed<span class="count" id="nFailed">·</span></button>
  </nav>

  <section id="tab-drafts">
    <div class="toolbar">
      <label>Start <input id="startDate" type="date"></label>
      <label>Days
        <select id="days"><option>1</option><option>2</option><option>3</option><option>5</option><option selected>7</option><option>10</option><option>14</option><option>21</option><option>30</option></select>
      </label>
      <label>Posts per day <input id="howMany" type="number" min="1" max="10" value="4" style="width:64px"></label>
      <label>10-ETF list post
        <select id="listEvery"><option value="0">Off</option><option value="4">Every 4th</option><option value="6">Every 6th</option><option value="8">Every 8th</option><option value="10">Every 10th</option><option value="12">Every 12th</option></select>
      </label>
      <button class="btn navy" id="genBtn" disabled>Generate posts</button>
      <span class="spacer"></span>
      <span class="cost" id="costNote"></span>
      <button class="btn primary" id="schedBtn" disabled>Schedule all</button>
    </div>
    <div id="drafts"></div>
  </section>

  <section id="tab-scheduled" hidden>
    <div class="toolbar"><button class="btn" id="refreshSched">Refresh</button><span class="spacer"></span><span class="cost">Posts go out within about 30 minutes of their time</span></div>
    <div id="scheduled"></div>
  </section>
  <section id="tab-posted" hidden>
    <div class="toolbar"><button class="btn" id="refreshPosted">Refresh</button></div>
    <div id="posted"></div>
  </section>
  <section id="tab-failed" hidden>
    <div class="toolbar"><button class="btn" id="refreshFailed">Refresh</button></div>
    <div id="failed"></div>
  </section>
</div>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <span class="hint">Saved only in this browser on this computer.</span>
    <h3>Auto posting</h3>
    <label>GitHub token
      <input id="s_token" type="password" autocomplete="off" placeholder="github_pat_…">
      <span class="hint">Fine-grained token with access to the WeeklyETFs poster repo only. Permissions: Contents read and write, Actions read and write.</span>
    </label>
    <div class="two">
      <label>GitHub username <input id="s_owner"></label>
      <label>Repo name <input id="s_repo"></label>
    </div>
    <div class="two">
      <label>First post time <input id="s_start" type="time"></label>
      <label>Last post time <input id="s_end" type="time"></label>
    </div>
    <h3>Funds</h3>
    <label>Popular weekly payers (used most of the time)
      <input id="s_fav">
      <span class="hint">About 2 of every 3 posts pick from this list. The rest pick from every fund in the sheet.</span>
    </label>
    <label>Never use these tickers <input id="s_excl" placeholder="XYZ"></label>
    <label>Highest yield to include (%)<input type="number" id="s_max" min="5" max="500"><span class="hint">Skips funds above this, in case a yield in the sheet looks off.</span></label>
    <label class="check"><input type="checkbox" id="s_nodecay"> Only use funds with no price decay</label>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form>
</dialog>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT1P00pQ6hNvYolxzrKYIuxC-AH1xFBpMtsn-NwC17W4vQazk3ql69ZmSmW8J-jp7OaUmKLV5v2KPI3/pub?gid=0&single=true&output=csv";
const SITE = "https://weeklyetfs.com";
const LINK_COST = 0.20, PLAIN_COST = 0.015;
const CFG_KEY = 'wx2.cfg.v1', MANUAL_KEY = 'wx2.manual.v1';
const POPULAR = 'MSTY, ULTY, YMAX, NVDY, CONY, TSLY, QDTE, XDTE, RDTE, CHPY, AMDW, GOOW, NVDW, PLTY, QQQY, YMAG, GPTY, BLOX, TOPW, ODTE';
const safeJSON = s => { try { return JSON.parse(s); } catch (e) { return null; } };
const readLS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const DEFAULT_CFG = { token: '', owner: 'benjiesiegel1414', repo: 'weeklyetfs-x-poster', branch: 'main', start: '08:00', end: '21:00', fav: POPULAR, excl: '', max: 150, nodecay: false, listEvery: 8 };
let cfg = { ...DEFAULT_CFG, ...(safeJSON(readLS(CFG_KEY)) || {}) };
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };
const $ = id => document.getElementById(id);
const state = { funds: [], drafts: [], history: new Set() };

/* =====================================================================
   DATA (WeeklyETFs sheet: Symbol, ETF Name, Dividend Yield, Price Decay, Total Return since inception)
   ===================================================================== */
function parseCSV(text) {
  const out = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell.trim()); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell.trim()); out.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell.trim()); out.push(row); }
  return out;
}
const num = s => { const v = parseFloat(String(s ?? '').replace(/[$,%\s]/g, '')); return isNaN(v) ? null : v; };
const buildFund = c => ({ sym: (c[0] || '').toUpperCase().replace(/[^A-Z.]/g, ''), name: c[1] || '', yield: num(c[2]), decay: String(c[3] || '').trim().toUpperCase(), tr: num(c[4]) });

/* =====================================================================
   FORMATTING
   ===================================================================== */
const usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = v => (Math.abs(v) < 100 ? usd2 : usd0).format(v || 0);
const pct = v => (+v).toFixed(2).replace(/\.?0+$/, '') + '%';
const signed = v => (v > 0 ? '+' : '') + pct(v);
const short = v => { const a = Math.abs(v), f = n => (v / n).toFixed(1).replace(/\.0$/, ''); return a >= 1e6 ? '$' + f(1e6) + 'M' : a >= 1e5 ? '$' + Math.round(v / 1e3) + 'K' : a >= 1e3 ? '$' + f(1e3) + 'K' : '$' + Math.round(v); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const tickers = s => String(s || '').toUpperCase().split(/[\s,$]+/).filter(Boolean);
const roundTo = (v, s) => Math.round(v / s) * s;
const today = () => new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

/* =====================================================================
   POST TYPES (one fund per post, one $ticker, first line)
   ===================================================================== */
const KIND_LABEL = { paycheck: 'Weekly paycheck', tr: 'Total return', growth: 'Invested at launch', goal: 'Weekly goal', nodecay: 'No price decay' };
const AMOUNTS = [5000, 10000, 15000, 20000, 25000, 50000, 75000, 100000, 250000];
const GROWTH_AMOUNTS = [1000, 5000, 10000, 25000, 50000, 100000];
const GOALS = [50, 100, 200, 250, 500, 1000, 2000];
const ASKS = ['Are you holding this one? 👇', 'Would you buy it? 👇', 'How much do you own? 👇', 'Is it in your weekly lineup? 👇', ''];
const YIELD_NOTE = "Yields change and aren't guaranteed";
const PAST_NOTE = "Past returns don't guarantee future results";
const eligible = (kind, f) => kind === 'tr' || kind === 'growth' ? f.tr != null && f.tr > 0 : kind === 'nodecay' ? f.decay === 'NO' : true;
function pickKind(f) {
  const bag = [['paycheck', 28], ['tr', 24], ['growth', 16], ['goal', 16], ['nodecay', 30]].filter(([k]) => eligible(k, f));
  let r = Math.random() * bag.reduce((s, [, w]) => s + w, 0);
  for (const [k, w] of bag) { if ((r -= w) < 0) return k; }
  return 'paycheck';
}
function paramsFor(kind) {
  if (kind === 'goal') return { goal: pick(GOALS) };
  if (kind === 'growth') return { amt: pick(GROWTH_AMOUNTS) };
  if (kind === 'tr') return {};
  return { amt: pick(AMOUNTS) };
}
function histKey(p) {
  if (p.kind === 'list') { let h = 0; for (const c of [...p.params.syms].sort().join(',')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `LIST_list_${h.toString(36)}`; }
  const f = p.fund, k = p.kind;
  const param = k === 'goal' ? p.params.goal : k === 'tr' ? Math.round(f.tr) : k === 'growth' ? `${p.params.amt}-${Math.round(f.tr)}` : p.params.amt;
  return `${f.sym}_${k}_${param}`;
}
function compute(p) {
  const f = p.fund, y = f.yield / 100;
  if (p.kind === 'goal') p.calc = { need: roundTo(p.params.goal * 52 / y, 100) };
  else if (p.kind === 'growth') p.calc = { value: p.params.amt * (1 + f.tr / 100) };
  else if (p.kind === 'tr') p.calc = {};
  else { const yr = p.params.amt * y; p.calc = { yr, mo: yr / 12, wk: yr / 52 }; }
}
function fit(options, tail) {
  // Try each wording with the full ending, then without the question, and keep the first one that fits in 280
  const opts = options.map(t => [t + tail.full, t + tail.short]).flat();
  return opts.find(t => [...t].length <= 280) || opts[opts.length - 1];
}
function writeText(p) {
  const f = p.fund, s = '$' + f.sym, y = pct(f.yield), c = p.calc, ask = pick(ASKS);
  const tail = note => ({ full: '\n\n' + note + (ask ? '\n\n' + ask : ''), short: '\n\n' + note });
  const shuffle = a => a.sort(() => Math.random() - .5);
  if (p.kind === 'paycheck') {
    const amt = usd0.format(p.params.amt);
    return fit(shuffle([
      `${s} 👇\n\n${amt} invested\n${money(c.wk)} every week\n${money(c.mo)} a month\n\nBased on its current ${y} yield`,
      `${s}: ${amt} could pay you about ${money(c.wk)} every single week\n\nThat's ${money(c.yr)} a year at its current ${y} yield`,
      `${s}: what ${amt} pays you 👇\n\n${money(c.wk)} a week\n${money(c.yr)} a year\n\n52 paychecks at a ${y} yield`,
    ]), tail(YIELD_NOTE));
  }
  if (p.kind === 'goal') {
    const g = usd0.format(p.params.goal), need = usd0.format(c.need);
    return fit(shuffle([
      `${s} 👇\n\nWant ${g} every week?\nYou'd need about ${need} invested at its ${y} yield`,
      `${s}: how much for a ${g} weekly paycheck?\n\nAbout ${need}\n\nThat's at its current ${y} yield`,
      `${s} at a ${y} yield\n\n${g} a week takes roughly ${need} invested\nThat's ${usd0.format(p.params.goal * 52)} a year`,
    ]), tail(YIELD_NOTE));
  }
  if (p.kind === 'tr') {
    const tr = signed(f.tr), dec = f.decay === 'NO' ? '\nPrice decay: none' : '';
    return fit(shuffle([
      `${s} total return since launch: ${tr}\n\nThat's price change plus every distribution paid\n\nCurrent yield: ${y}`,
      `${s} 👇\n\nYield: ${y}\nTotal return since launch: ${tr}${dec}\n\nYield is only half the story, total return counts the price too`,
      `${s} has returned ${tr} since launch with distributions included\n\nAnd it still yields ${y}`,
    ]), tail(PAST_NOTE));
  }
  if (p.kind === 'growth') {
    const amt = usd0.format(p.params.amt), val = usd0.format(roundTo(c.value, c.value >= 10000 ? 100 : 10));
    return fit(shuffle([
      `${s}: ${amt} invested at launch would be worth about ${val} today\n\nThat's a ${signed(f.tr)} total return with distributions included`,
      `${s} 👇\n\n${amt} at launch\nAbout ${val} today\n\n${signed(f.tr)} total return, distributions included`,
      `${s}: put ${amt} in on day one and you'd have about ${val} now\n\nTotal return since launch: ${signed(f.tr)}\nCurrent yield: ${y}`,
    ]), tail(PAST_NOTE));
  }
  // nodecay
  const amt = usd0.format(p.params.amt), trLine = f.tr != null ? `\nTotal return since launch: ${signed(f.tr)}` : '';
  return fit(shuffle([
    `${s} 👇\n\n${y} yield\nPaid every week\nNo price decay${trLine}\n\n${amt} would pay about ${money(c.wk)} a week`,
    `${s}: a ${y} yield with NO price decay\n\n${amt} in it pays about ${money(c.wk)} every week`,
    `${s} pays weekly and has no price decay 👇\n\nYield: ${y}${trLine}\n${amt} pays about ${money(c.wk)} a week`,
  ]), tail(YIELD_NOTE));
}
function linkFor(p) {
  const q = new URLSearchParams({ utm_source: 'x', utm_medium: 'social', utm_campaign: 'scheduler' });
  return `${SITE}/yield/${p.fund.sym.toLowerCase()}-yield-and-total-returns.html?${q}`;
}
const finalText = p => p.link ? p.text + '\n\n' + linkFor(p) : p.text;
// X's API allows only one $TICKER per post. Anything past the first is written plain when scheduling.
function oneCashtag(t) { let first = true; return t.replace(/\$([A-Za-z][A-Za-z.]{0,5})\b/g, (m, sym) => { if (first) { first = false; return m; } return sym; }); }
const cashtagCount = t => (t.match(/\$[A-Za-z][A-Za-z.]{0,5}\b/g) || []).length;

/* =====================================================================
   IMAGE (1200x675, WeeklyETFs brand)
   ===================================================================== */
function roundRect(ctx, x, y, w, h, r) { r = Math.min(r, h / 2, w / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawCard(o) {
  const W = 1200, H = 675, S = 2, cv = document.createElement('canvas'); cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  const F = (w, s) => `${w} ${s}px Lato, Arial, sans-serif`;
  ctx.fillStyle = '#001f3d'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W, 0, 0, W, 0, 900); g.addColorStop(0, 'rgba(231,76,60,.22)'); g.addColorStop(1, 'rgba(231,76,60,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, 0, W, 8);
  // wordmark + date
  ctx.textAlign = 'left'; ctx.font = F(900, 26); ctx.fillStyle = '#fff'; ctx.fillText('Weekly', 64, 70);
  const ww = ctx.measureText('Weekly').width; ctx.fillStyle = '#e74c3c'; ctx.fillText('ETFs', 64 + ww, 70);
  const we = ctx.measureText('ETFs').width; ctx.fillStyle = '#fff'; ctx.fillText('.com', 64 + ww + we, 70);
  ctx.textAlign = 'right'; ctx.fillStyle = '#9fb3c8'; ctx.font = F(700, 18); ctx.fillText(`Data as of ${today()}`, W - 64, 68);
  // sentence
  ctx.textAlign = 'left'; ctx.fillStyle = '#9fb3c8'; let s1 = 30; ctx.font = F(700, s1);
  while (ctx.measureText(o.line1).width > 620 && s1 > 18) { s1 -= 1; ctx.font = F(700, s1); }
  ctx.fillText(o.line1, 64, 160);
  ctx.font = F(700, 30); ctx.fillText(o.line2, 64, 200);
  // big number + unit
  let size = 140; ctx.font = F(900, size);
  while (ctx.measureText(o.big).width > 640 && size > 60) { size -= 4; ctx.font = F(900, size); }

function pool() {
  const excl = new Set(tickers(cfg.excl));
  return state.funds.filter(f => f.yield > 0.5 && f.yield <= (+cfg.max || 150) && !excl.has(f.sym) && (!cfg.nodecay || f.decay === 'NO'));
}
function chooseFund(taken) {
  const fav = new Set(tickers(cfg.fav)), all = pool().filter(f => !taken.has(f.sym));
  const favs = all.filter(f => fav.has(f.sym));
  const src = favs.length && Math.random() < .67 ? favs : all;
  return src.length ? pick(src) : null;
}
const isPopular = f => tickers(cfg.fav).includes(f.sym);
function makePost(fund, kind, used) {
  if (!eligible(kind, fund)) return null;
  for (let i = 0; i < 25; i++) {
    const p = { id: Math.random().toString(36).slice(2, 10), fund, sym: fund.sym, kind, params: paramsFor(kind), link: false };
    compute(p);
    const key = histKey(p);
    if (state.history.has(key) || used.has(key)) { if (kind === 'tr') return null; continue; }
    p.text = writeText(p); p.img = drawImage(p); return p;
  }
  return null;
}
function slotTimes(n, day) {
  const [sh, sm] = cfg.start.split(':').map(Number), [eh, em] = cfg.end.split(':').map(Number);
  const startT = new Date(day); startT.setHours(sh, sm, 0, 0);
  const endT = new Date(day); endT.setHours(eh, em, 0, 0);
  let from = startT.getTime();
  const soonest = Date.now() + 20 * 60e3;
  if (from < soonest) from = Math.ceil(soonest / 300e3) * 300e3;
  const to = endT.getTime();
  if (to <= from) return null;
  const gap = n > 1 ? (to - from) / (n - 1) : 0;
  return Array.from({ length: n }, (_, i) => {
    const t = from + gap * i + (i && i < n - 1 ? (Math.random() - .5) * Math.min(gap * .5, 20 * 60e3) : 0);
    return new Date(Math.round(t / 300e3) * 300e3);
  });
}
function startDay() {
  const v = $('startDate').value;
  if (v) { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); }
  const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(0, 0, 0, 0); return t;
}
async function generate() {
  const perDay = Math.max(1, Math.min(10, parseInt($('howMany').value, 10) || 4));
  const days = Math.max(1, Math.min(30, parseInt($('days').value, 10) || 1));
  const first = startDay();
  try { await document.fonts.load('900 40px Lato'); await document.fonts.load('700 24px Lato'); } catch (e) {}
  const used = new Set(), out = [], kindsUsed = {}, listEvery = +$('listEvery').value || 0, listSyms = new Set();
  cfg.listEvery = listEvery; saveCfg();
  let recent = [];   // funds used in the last couple of days, so the same fund doesn't show up day after day
  let skipped = 0;
  for (let d = 0; d < days; d++) {
    const day = new Date(first); day.setDate(first.getDate() + d);
    const times = slotTimes(perDay, day);
    if (!times) { skipped++; continue; }
    const taken = new Set(recent.flat());
    const dayPosts = [];
    let tries = 0;
    while (dayPosts.length < perDay && tries++ < perDay * 30) {
      if (listEvery && (out.length + dayPosts.length + 1) % listEvery === 0 && !dayPosts.some(isList)) {
        const lp = makeListPost(null, listSyms);
        if (lp && !used.has(histKey(lp))) { lp.at = times[dayPosts.length]; used.add(histKey(lp)); lp.funds.forEach(f => listSyms.add(f.sym)); dayPosts.push(lp); continue; }
      }
      let fund = chooseFund(taken);
      if (!fund) { taken.clear(); dayPosts.forEach(p => taken.add(p.sym)); fund = chooseFund(taken); if (!fund) break; }
      let kind = pickKind(fund);
      // Keep things varied: no post type more than about a third of the time
      if ((kindsUsed[kind] || 0) >= Math.max(1, Math.ceil((out.length + perDay) / 3))) kind = pickKind(fund);
      const p = makePost(fund, kind, used) || makePost(fund, 'paycheck', used);
      if (!p) { taken.add(fund.sym); continue; }
      p.at = times[dayPosts.length]; taken.add(fund.sym); used.add(histKey(p)); kindsUsed[p.kind] = (kindsUsed[p.kind] || 0) + 1; dayPosts.push(p);
    }
    out.push(...dayPosts);
    recent = [...recent.slice(-1), dayPosts.map(p => p.sym)];
  }
  state.drafts = out;
  renderDrafts();
  if (!out.length) return toast(`Nothing left to schedule in that window (${cfg.start} to ${cfg.end}). Pick a later start date`);
  if (skipped) toast(`Skipped ${skipped} day${skipped > 1 ? 's' : ''} whose posting window already passed`);
  else if (out.length < perDay * days) toast(`Made ${out.length} fresh posts. Add more tickers in Settings for more variety`);
}

$('drafts').addEventListener('change', e => {
  const el = e.target, card = el.closest('.post'); if (!card) return;
  const p = state.drafts.find(d => d.id === card.dataset.id); if (!p) return;
  const act = el.dataset.act;
  if (act === 'time') { if (!el.value) return; const [ds, ts] = el.value.split('T'), [y, mo, dd] = ds.split('-').map(Number), [h, m] = ts.split(':').map(Number); p.at = new Date(y, mo - 1, dd, h, m, 0, 0); renderDrafts(); }
  if (act === 'kind') {
    const np = makePost(p.fund, el.value, new Set(state.drafts.filter(d => d !== p).map(histKey)));
    if (!np) { toast('That type was already used for this fund'); return renderDrafts(); }
    replaceWith(p, np); renderDrafts();
  }
  if (act === 'link') { p.link = el.checked; renderDrafts(); }
  if (act === 'theme') { const np = makeListPost(el.value); if (!np) { toast('Not enough funds for that list'); return renderDrafts(); } replaceWith(p, np); renderDrafts(); }
});
$('drafts').addEventListener('input', e => {
  const el = e.target; if (el.dataset.act !== 'text') return;
  const card = el.closest('.post'), p = state.drafts.find(d => d.id === card.dataset.id); if (!p) return;
  p.text = el.value;
  const link = card.querySelector('a.btn'); if (link) link.href = xUrl(p);
  const len = [...finalText(p)].length, ch = card.querySelector('.chars'); ch.textContent = `${len}/280`; ch.classList.toggle('over', len > 280);
  card.querySelectorAll('.side > .err-text, .side > .status-line').forEach(x => x.remove());
  const l = lintText(finalText(p)); if (l) card.querySelector('.side').insertAdjacentHTML('beforeend', l);
});

/* =====================================================================
   POST IT MYSELF (free, no X API). Open in the browser logged into @WeeklyETFs
   ===================================================================== */
function manualHistory() { return safeJSON(readLS(MANUAL_KEY)) || []; }
function rememberManual(p) {
  try { const h = manualHistory(); h.push(histKey(p)); localStorage.setItem(MANUAL_KEY, JSON.stringify(h.slice(-3000))); } catch (e) {}
  state.history.add(histKey(p));
}
function dataURLtoBlob(url) { const [h, d] = url.split(','), b = atob(d), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return new Blob([a], { type: h.match(/:(.*?);/)[1] }); }
const xUrl = p => 'https://x.com/intent/post?text=' + encodeURIComponent(finalText(p));
function saveImage(p) { const a = document.createElement('a'); a.href = p.img; a.download = `${p.sym}-weekly.png`; document.body.appendChild(a); a.click(); a.remove(); }
const isTouch = matchMedia('(pointer: coarse)').matches;
function postManually(p) {
  const text = finalText(p), blob = dataURLtoBlob(p.img), file = new File([blob], `${p.sym}-weekly.png`, { type: 'image/png' });
  const done = () => { p.sent = true; rememberManual(p); renderDrafts(); };
  if (isTouch && navigator.canShare && navigator.canShare({ files: [file], text })) {
    navigator.share({ files: [file], text }).then(() => { done(); toast('Pick X in the share sheet. If the text is missing, tap Copy text and paste it', 8000); })
      .catch(e => { if (e.name !== 'AbortError') toast("Couldn't open the share sheet. Use Save image instead"); });
    return;
  }
  const openX = () => { const w = window.open(xUrl(p), '_blank'); if (w) { try { w.opener = null; } catch (e) {} return true; } p.needsLink = true; return false; };
  let cp; try { cp = navigator.clipboard.write([new ClipboardItem({ 'image/png': Promise.resolve(blob) })]); } catch (e) { cp = Promise.reject(e); }
  cp.then(() => { const o = openX(); done(); toast(o ? 'Image copied. Click in the X post box and press Cmd+V' : 'Image copied. Click Open X on this post, then paste with Cmd+V', 10000); })
    .catch(() => { saveImage(p); const o = openX(); done(); toast(o ? 'Image saved to Downloads. Drag it into the X post box' : 'Image saved to Downloads. Click Open X on this post, then drag it in', 10000); });
}

/* =====================================================================
   GITHUB (same queue format as the DividendProjection poster)
   ===================================================================== */
const ghReady = () => cfg.token && cfg.owner && cfg.repo;
async function gh(path, opts = {}, raw = false) {
  const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${path}`, {
    ...opts,
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
  });
  if (r.status === 404 && opts.allow404) return null;
  if (!r.ok) { let msg = ''; try { msg = (await r.json()).message; } catch (e) {} const err = new Error(`GitHub ${r.status}${msg ? ': ' + msg : ''}`); err.status = r.status; throw err; }
  if (r.status === 204) return null;
  return raw ? r.blob() : r.json();
}
const b64utf8 = s => { const bytes = new TextEncoder().encode(s); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
async function commitFiles(files, message) {
  const entries = [];
  for (const f of files) {
    if (f.del) { const exists = await gh(`/contents/${f.path}?ref=${cfg.branch}`, { allow404: true }); if (exists) entries.push({ path: f.path, mode: '100644', type: 'blob', sha: null }); continue; }
    const blob = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: f.b64, encoding: 'base64' }) });
    entries.push({ path: f.path, mode: '100644', type: 'blob', sha: blob.sha });
  }
  if (!entries.length) return;
  let lastErr;
  for (let attempt = 0; attempt < 4; attempt++) {
    const ref = await gh(`/git/ref/heads/${cfg.branch}`);
    const head = await gh(`/git/commits/${ref.object.sha}`);
    const tree = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: head.tree.sha, tree: entries }) });
    const commit = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: tree.sha, parents: [ref.object.sha] }) });
    try { await gh(`/git/refs/heads/${cfg.branch}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) }); return; }
    catch (e) { if (e.status !== 422) throw e; lastErr = e; await new Promise(r => setTimeout(r, 2000)); }
  }
  throw new Error(`Couldn't save to GitHub (${lastErr ? lastErr.message : 'unknown error'}). Click Refresh and try again`);
}
async function listDir(dir) { const items = await gh(`/contents/${dir}?ref=${cfg.branch}`, { allow404: true }); return (items || []).filter(i => i.type === 'file' && i.name !== '.gitkeep'); }
async function readJSON(path) { const blob = await gh(`/contents/${path}?ref=${cfg.branch}`, {}, true); return JSON.parse(await blob.text()); }
const fileBase = p => `${p.at.toISOString().replace(/[-:]/g, '').slice(0, 13)}_${histKey(p)}_${p.id}`;
function keyFromName(name) { const parts = name.replace(/(-\d+)?\.(json|png)$/, '').split('_'); return parts.length >= 5 ? `${parts[1]}_${parts[2]}_${parts[3]}` : null; }
async function loadHistory() {
  if (!ghReady()) return;
  try {
    const [q, p] = await Promise.all([listDir('queue'), listDir('posted')]);
    state.history = new Set([...q, ...p].map(f => keyFromName(f.name)).filter(Boolean).concat(manualHistory()));
    $('nSched').textContent = q.filter(f => f.name.endsWith('.json')).length;
    showSetup();
  } catch (e) { showSetup(e.message); }
}
async function scheduleAll() {
  if (!ghReady()) { openSettings(); return toast('Add your GitHub token first'); }
  if (state.drafts.some(p => [...finalText(p)].length > 280)) return toast('A post is over 280 characters. Shorten it first');
  if (state.drafts.some(p => p.at.getTime() < Date.now())) return toast('Some times are already in the past. Change them first');
  const btn = $('schedBtn'); btn.disabled = true; btn.textContent = 'Scheduling…';
  try {
    await loadHistory();
    const clash = state.drafts.filter(p => state.history.has(histKey(p)));
    if (clash.length) throw new Error(`${clash.map(p => isList(p) ? 'A 10 ETF list' : '$' + p.sym).join(', ')} already used those exact numbers. Hit ${clash.some(isList) ? 'New funds' : 'New numbers'} first`);
    const files = [];
    for (const p of state.drafts) {
      const base = fileBase(p);
      const rec = { id: p.id, sym: p.sym, kind: p.kind, params: p.params, ...(isList(p) ? { syms: p.params.syms } : {}), yield: p.fund.yield, tr: p.fund.tr, decay: p.fund.decay, images: 1, text: oneCashtag(finalText(p)), link: p.link, post_at: p.at.toISOString(), created_at: new Date().toISOString() };
      files.push({ path: `queue/${base}.json`, b64: b64utf8(JSON.stringify(rec, null, 2)) });
      files.push({ path: `queue/${base}.png`, b64: p.img.split(',')[1] });
    }
    await commitFiles(files, `Queue ${state.drafts.length} posts`);
    toast(`Scheduled ${state.drafts.length} posts`);
    state.drafts = []; renderDrafts(); loadHistory();
  } catch (e) { toast(e.message, 7000); }
  btn.textContent = 'Schedule all'; btn.disabled = !state.drafts.length;
}
$('schedBtn').addEventListener('click', scheduleAll);

/* =====================================================================
   SCHEDULED / POSTED / FAILED
   ===================================================================== */
async function renderList(dir, box, opts) {
  if (!ghReady()) { box.innerHTML = `<div class="empty">Add your GitHub token in Settings to see this.</div>`; return; }
  box.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    let files = (await listDir(dir)).filter(f => f.name.endsWith('.json')).sort((a, b) => a.name.localeCompare(b.name));
    if (opts.newestFirst) files.reverse();
    if (opts.limit) files = files.slice(0, opts.limit);
    if (dir === 'queue') $('nSched').textContent = files.length;
    if (dir === 'failed') $('nFailed').textContent = files.length;
    if (!files.length) { box.innerHTML = `<div class="empty">${opts.emptyText}</div>`; return; }
    const recs = await Promise.all(files.map(async f => ({ f, r: await readJSON(f.path) })));
    box.innerHTML = recs.map(({ f, r }) => `<article class="post" data-path="${esc(f.path)}">
      ${opts.images ? `<img${r.kind === 'list' ? ' class="sq"' : ''} alt="Image for ${esc(r.sym)} post" data-img="${esc(f.path.replace(/\.json$/, '.png'))}">` : ''}
      <div class="side">
        <div class="meta">${r.kind === 'list' ? `<span class="tag pop">10 ETF list</span><span>${esc((r.syms || []).join(', '))}</span>` : `<span class="tag">$${esc(r.sym)}</span><span>${esc(KIND_LABEL[r.kind] || r.kind)}</span>`}</div>
        <div class="status-line">${opts.line(r)}</div>
        <textarea readonly>${esc(r.text)}</textarea>
        ${r.error ? `<div class="err-text">${esc(r.error)}</div>` : ''}
        ${opts.actions ? `<div class="row">${opts.actions}</div>` : ''}
      </div></article>`).join('');
    if (opts.images) box.querySelectorAll('img[data-img]').forEach(async img => { try { img.src = URL.createObjectURL(await gh(`/contents/${img.dataset.img}?ref=${cfg.branch}`, {}, true)); } catch (e) {} });
  } catch (e) { box.innerHTML = `<div class="notice err">${esc(e.message)}</div>`; }
}
const showScheduled = () => renderList('queue', $('scheduled'), {
  images: true, emptyText: 'Nothing scheduled. Generate posts and click Schedule all',
  line: r => `Posts ${esc(fmtWhen(new Date(r.post_at)))}${r.attempts ? `, tried ${r.attempts} time${r.attempts > 1 ? 's' : ''}` : ''}`,
  actions: `<button class="btn small" data-act="now">Post now</button><button class="btn small danger" data-act="unschedule">Unschedule</button>`,
});
const showPosted = () => renderList('posted', $('posted'), { newestFirst: true, limit: 30, emptyText: 'Nothing posted yet',
  line: r => `Posted ${esc(fmtWhen(new Date(r.posted_at)))}, <a href="${esc(r.url)}" target="_blank" rel="noopener">Open on X</a>` });
const showFailed = () => renderList('failed', $('failed'), { newestFirst: true, emptyText: 'No failed posts',
  line: r => `Was due ${esc(fmtWhen(new Date(r.post_at)))}` });
$('scheduled').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const card = btn.closest('.post'), path = card.dataset.path, png = path.replace(/\.json$/, '.png');
  btn.disabled = true;
  try {
    if (btn.dataset.act === 'unschedule') {
      await commitFiles([{ path, del: true }, { path: png, del: true }], 'Unschedule post');
      toast('Unscheduled');
    } else {
      let r; try { r = await readJSON(path); } catch (err) { toast('That post is no longer in the queue. It may have posted already'); return showScheduled(); }
      r.post_at = new Date().toISOString();
      await commitFiles([{ path, b64: b64utf8(JSON.stringify(r, null, 2)) }], 'Post now');
      try { await gh('/actions/workflows/post.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: cfg.branch }) }); toast('Posting now, it should be live in a minute or two'); }
      catch (err) { toast('Moved to now. It will post on the next run'); }
    }
    showScheduled(); loadHistory();
  } catch (err) { toast(err.message); btn.disabled = false; }
});
$('refreshSched').addEventListener('click', showScheduled);
$('refreshPosted').addEventListener('click', showPosted);
$('refreshFailed').addEventListener('click', showFailed);

/* =====================================================================
   TABS, SETTINGS, BOOT
   ===================================================================== */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['drafts', 'scheduled', 'posted', 'failed'].forEach(t => $('tab-' + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'scheduled') showScheduled();
  if (b.dataset.tab === 'posted') showPosted();
  if (b.dataset.tab === 'failed') showFailed();
}));
function openSettings() {
  $('s_token').value = cfg.token; $('s_owner').value = cfg.owner; $('s_repo').value = cfg.repo; $('s_start').value = cfg.start; $('s_end').value = cfg.end;
  $('s_fav').value = cfg.fav; $('s_excl').value = cfg.excl; $('s_max').value = cfg.max; $('s_nodecay').checked = !!cfg.nodecay;
  $('settings').showModal();
}
$('settingsBtn').addEventListener('click', openSettings);
$('settings').addEventListener('close', () => {
  if ($('settings').returnValue !== 'save') return;
  cfg = { ...cfg, token: $('s_token').value.trim(), owner: $('s_owner').value.trim(), repo: $('s_repo').value.trim(), start: $('s_start').value || '08:00', end: $('s_end').value || '21:00',
    fav: $('s_fav').value, excl: $('s_excl').value, max: parseFloat($('s_max').value) || 150, nodecay: $('s_nodecay').checked };
  saveCfg(); updateStatus(); showSetup(); loadHistory(); toast('Settings saved');
});
function showSetup(err) {
  const box = $('setupNotice');
  if (err) box.innerHTML = `<div class="notice err">Can't reach the poster repo: ${esc(err)}. Check the token and repo name in Settings.</div>`;
  else if (!ghReady()) box.innerHTML = `<div class="notice warn">Posts made here go out as <b>@WeeklyETFs</b>. Use <b>Post it myself</b> (open this in the browser logged into WeeklyETFs), or add your GitHub token in Settings to schedule them.</div>`;
  else box.innerHTML = '';
}
let tt; function toast(m, ms = 4200) { document.querySelector('.toast')?.remove(); clearTimeout(tt); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); tt = setTimeout(() => t.remove(), ms); }
function updateStatus() {
  if (!state.funds.length) return;
  const withTR = state.funds.filter(f => f.tr != null).length;
  $('dataStatus').textContent = `${state.funds.length} weekly ETFs loaded (${withTR} with total return), ${pool().length} in the posting pool`;
}
$('genBtn').addEventListener('click', generate);
$('listEvery').value = String(cfg.listEvery ?? 8);
{ const t = new Date(), m = new Date(); m.setDate(m.getDate() + 1); $('startDate').min = ymd(t); $('startDate').value = ymd(m); }

showSetup();
state.history = new Set(manualHistory());
renderDrafts();
loadHistory();
fetch(CSV_URL + '&t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(csv => {
    state.funds = parseCSV(csv.trim()).slice(1).filter(c => c[0]).map(buildFund).filter(f => f.sym && f.yield !== null);
    updateStatus(); $('genBtn').disabled = false;
  })
  .catch(() => { $('dataStatus').textContent = location.protocol === 'file:' ? "Couldn't load the sheet. Open this from weeklyetfs.com/x-queue instead" : "Couldn't load the sheet. Refresh to try again"; });
</script>
