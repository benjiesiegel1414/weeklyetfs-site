name: Prerender weekly ETF list
on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/prerender-list.mjs', '.github/workflows/prerender-list.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/prerender-list.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Prerender weekly ETF list" && git push)
